type StarSystem implements Positionable {
	id: ID!
	name: String!
	position: Vector!
	owner: Player
	industrialProjects: [IndustrialProject!]!
	completedIndustrialProjects: [IndustrialProject!]!
	industryBreakdown: IndustryBreakdown
	currentDevelopmentStance: DevelopmentStance
	nextTurnStanceProjection: DevelopmentStanceProjection
	colonization: StarSystemColonizationPressure
	colonizationGovernance: ColonizationGovernance
	colonizationPressureSources: [ColonizationPressureSourceOption!]!
	sensorRange: Float
	discoveries: [Discovery!]
	discoveryProgress: Float
	populations: [Population!]
	industry: Int
	isVisible: Boolean!
	lastUpdate: DateTime
}

type IndustryBreakdown {
	rawIndustry: Int!
	populationCap: Int!
	cappedIndustry: Int!
	maintenance: Int!
	colonizationAllocated: Int!
	netIndustry: Int!
}

type StarSystemColonizationPressure {
	player: Player!
	accumulated: Float!
	threshold: Float!
	pressurePerTurn: Float!
	etaTurns: Int!
}

type ColonizationPressureSourceOption {
	sourceStarSystemId: ID!
	sourceStarSystemName: String!
	distance: Float!
	population: BigInt!
	availableIndustry: Int!
	allocatedIndustry: Int!
	populationFactor: Float!
	distanceFactor: Float!
	projectedPressurePerTurn: Float!
}

input ColonizationPressureAllocationInput {
	sourceStarSystemId: ID!
	industryCommitted: Int!
}

union Discovery = ResourceDiscovery | UnknownDiscovery

type ResourceDiscovery {
	id: ID!
	resource: Resource!
	remainingDeposits: Float!
	miningRate: Float!
}

type UnknownDiscovery {
	id: ID!
}

type Population {
	id: ID!
	amount: BigInt!
}

enum DevelopmentStance {
	industrialize
	balance
	grow_population
}

enum ColonizationGovernance {
	focus
	forbid
}

type DevelopmentStanceProjection {
	industryDelta: Int!
	populationDelta: BigInt!
}

enum IndustrialProjectType {
	factory_expansion
	automation_hub
	orbital_foundry
	deep_core_scanner
	xenoarchaeology_lab
	habitation_dome
	gravity_well_spire
	fleet_drydock
}

type IndustrialProject {
	id: ID!
	projectType: IndustrialProjectType!
	category: String!
	description: String!
	industryPerTurn: Int!
	workRequired: Int!
	workDone: Int!
	completionIndustryBonus: Int!
	maintenanceCost: Int!
	queuePosition: Int!
	queuedAtTurn: Int!
	startedAtTurn: Int
	completedAtTurn: Int
	turnsRemaining: Int!
	etaTurns: Int!
}

extend type Game {
	starSystems: [StarSystem!]!
}

type Query {
	starSystem(id: ID!): StarSystem!
}

extend type Mutation {
	setDevelopmentStance(
		starSystemId: ID!
		stance: DevelopmentStance!
	): StarSystem!
	setColonizationGovernance(
		starSystemId: ID!
		governance: ColonizationGovernance
	): StarSystem!
	setColonizationPressureAllocation(
		targetStarSystemId: ID!
		allocations: [ColonizationPressureAllocationInput!]!
	): StarSystem!
	abandonIndustrialProject(projectId: ID!): StarSystem!
	queueIndustrialProject(
		starSystemId: ID!
		projectType: IndustrialProjectType!
	): StarSystem!
}
