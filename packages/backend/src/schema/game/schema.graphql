scalar DateTime

type Game {
	id: ID!
	name: String!

	autoEndTurnAfterHoursInactive: Int
	autoEndTurnEveryHours: Int

	startedAt: DateTime
	players: [Player!]!

	turnNumber: Int!
	turnReports(limit: Int = 20): [TurnReport!]!

	me: Player
}

type TurnReport {
	id: ID!
	turnNumber: Int!
	createdAt: DateTime!
	populationChanges: [TurnReportPopulationChange!]!
	populationMigrations: [TurnReportPopulationMigration!]!
	miningChanges: [TurnReportMiningChange!]!
	industryChanges: [TurnReportIndustryChange!]!
	industrialProjectCompletions: [TurnReportIndustrialProjectCompletion!]!
	taskForceConstructionChanges: [TurnReportTaskForceConstructionChange!]!
	taskForceEngagements: [TurnReportTaskForceEngagement!]!
	colonizationPressureChanges: [TurnReportColonizationPressureChange!]!
	colonizationCompleted: [TurnReportColonizationCompleted!]!
	researchProgressChanges: [TurnReportResearchProgressChange!]!
	researchBreakthroughs: [TurnReportResearchBreakthrough!]!
}

enum ResearchCategory {
	military
	industry
	expansion
	discovery
}

enum ResearchMethodology {
	stable
	bold
	opportunistic
}

enum ResearchPhase {
	hypothesis
	fieldwork
	synthesis
}

type PlayerResearchDirective {
	primaryCategory: ResearchCategory!
	secondaryCategory: ResearchCategory!
	methodology: ResearchMethodology!
	turnNumber: Int!
}

type PlayerResearchState {
	category: ResearchCategory!
	breakthroughCount: Int!
	phase: ResearchPhase!
	cumulativeMomentum: Float!
	recentEvidence: Float!
	synthesisProgress: Float!
	consecutivePrimary: Int!
	lastUpdatedTurn: Int!
}

type PlayerResearchOutcome {
	id: ID!
	category: ResearchCategory!
	turnNumber: Int!
	outcomeKey: String!
	outcomeMode: String!
	stat: String!
	modifier: Float!
}

type TurnReportPopulationMigration {
	sourceStarSystem: StarSystem!
	destinationStarSystem: StarSystem!
	allegiancePlayer: User!
	amount: BigInt!
}

type TurnReportTaskForceEngagement {
	engagementId: ID!
	status: String!
	taskForceAId: ID!
	taskForceBId: ID!
	taskForceAName: String!
	taskForceBName: String!
	winnerTaskForceId: ID
	location: Vector!
}

type TurnReportColonizationPressureChange {
	starSystem: StarSystem!
	pressureAdded: String!
	accumulatedPressure: String!
	pressureThreshold: String!
}

type TurnReportColonizationCompleted {
	starSystem: StarSystem!
	accumulatedPressure: String!
	pressureThreshold: String!
}

type TurnReportResearchProgressChange {
	category: ResearchCategory!
	momentumGained: String!
	totalMomentum: String!
	phase: ResearchPhase!
	phaseChanged: Boolean!
}

type TurnReportResearchBreakthrough {
	category: ResearchCategory!
	outcomeKey: String!
	outcomeMode: String!
	stat: String!
	modifier: String!
}

type TurnReportPopulationChange {
	starSystem: StarSystem!
	population: Population!
	previousAmount: BigInt!
	newAmount: BigInt!
	growth: BigInt!
}

type TurnReportIndustryChange {
	starSystem: StarSystem!
	industryTotal: Int!
	industryUtilized: Int!
}

type TurnReportMiningChange {
	starSystem: StarSystem!
	resource: Resource!
	mined: Float!
	remainingDeposits: Float!
	depotQuantity: Float!
}

type TurnReportIndustrialProjectCompletion {
	starSystem: StarSystem!
	projectType: IndustrialProjectType!
	industryBonus: Int!
}

type TurnReportTaskForceConstructionChange {
	taskForce: TaskForce!
	starSystem: StarSystem!
	previousDone: Int!
	newDone: Int!
	total: Int!
	perTick: Int!
	completed: Boolean!
}

type Player {
	id: ID!
	name: String!
	color: String!
	user: User!
	turnEnded: Boolean
	currentResearchDirective: PlayerResearchDirective
	researchStates: [PlayerResearchState!]!
	researchOutcomes(limit: Int = 20): [PlayerResearchOutcome!]!
}

input UpdatePlayerInput {
	color: String
}

input UpdateGameSettingsInput {
	autoEndTurnAfterHoursInactive: Int
	autoEndTurnEveryHours: Int
}

type Query {
	games: [Game!]!
	game(id: ID!): Game!
}

type Mutation {
	createGame(name: String!): Game!
	joinGame(id: ID!): Game!
	startGame(id: ID!): Game!
	updatePlayer(gameId: ID!, input: UpdatePlayerInput!): Player!
	updateGameSettings(gameId: ID!, input: UpdateGameSettingsInput!): Game!

	endTurn(gameId: ID!, expectedTurnNumber: Int!): Game!
	setResearchFocus(
		gameId: ID!
		primaryCategory: ResearchCategory!
		secondaryCategory: ResearchCategory!
		methodology: ResearchMethodology!
	): Player!
}

union TrackGameEvent = TurnEndedEvent | NewTurnCalculatedEvent

type TurnEndedEvent {
	game: Game!
}

type NewTurnCalculatedEvent {
	game: Game!
}

type Subscription {
	trackGame(gameId: ID!): TrackGameEvent!
}
