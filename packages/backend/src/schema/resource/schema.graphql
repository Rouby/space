type Resource {
	id: ID!
	name: String!
	kind: String!
	description: String!
	statBonuses: [ResourceStatBonus!]
}

type ResourceStatBonus {
	stat: String!
	modifier: Float!
}

type ResourceCost {
	resource: Resource!
	quantity: Float!
}

extend type Game {
	resources: [Resource!]!
}

extend type Player {
	resources: [Resource!]!
}
